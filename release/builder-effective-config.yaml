directories:
  output: release
  buildResources: build
appId: com.fiduciaryduty.desktop
productName: Fiduciary Duty
files:
  - filter:
      - dist/**/*
      - package.json
extraMetadata:
  main: dist/electron/main.js
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerLanguages:
    - en_US
  language: '1033'
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
publish:
  - provider: generic
    url: https://example.invalid/fiduciary-duty-updates
electronVersion: 28.3.3

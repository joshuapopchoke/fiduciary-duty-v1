<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiduciary Duty</title>
    <script>
      (function () {
        var STORAGE_KEY = "fd-resolution";
        window.__applyResolution = function (label) {
          if (!label || label === "Auto" || label === "Clear") {
            localStorage.removeItem(STORAGE_KEY);
          } else {
            localStorage.setItem(STORAGE_KEY, label);
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main.tsx"></script>
  </body>
</html>

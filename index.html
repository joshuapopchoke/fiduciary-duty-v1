<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' http://127.0.0.1:5173 http://localhost:5173; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:5173 ws://localhost:5173 http://127.0.0.1:5173 http://localhost:5173 https:; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Fiduciary Duty</title>

    <!-- Resolution picker support — window.__applyResolution() is called by
         ResolutionPicker.tsx. Layout now fills viewport natively via CSS;
         this only adjusts font-size scaling for the selected resolution. -->
    <script>
      (function () {
        var STORAGE_KEY = "fd-resolution";

        // Minimum supported: 1024x768
        // At native res the font-size clamp() in CSS handles scaling.
        // __applyResolution is kept so the picker dropdown still works
        // and persists the user choice across sessions.
        window.__applyResolution = function (label) {
          if (!label || label === "Auto" || label === "Clear") {
            localStorage.removeItem(STORAGE_KEY);
          } else {
            localStorage.setItem(STORAGE_KEY, label);
          }
          // Layout fills viewport natively — no transform needed
        };

        // On load, just restore the stored label into the picker state.
        // No scale transform applied — CSS handles everything via vw units.
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/renderer/main.tsx"></script>
  </body>
</html>
